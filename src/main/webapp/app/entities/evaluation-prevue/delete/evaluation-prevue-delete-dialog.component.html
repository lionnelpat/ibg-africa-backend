@if (evaluationPrevue) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(evaluationPrevue.id!)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="evaluationPrevueDeleteDialogHeading" jhiTranslate="entity.delete.title">
        Confirmation de suppression
      </h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      <p
        id="jhi-delete-evaluationPrevue-heading"
        jhiTranslate="forbidecBackendApp.evaluationPrevue.delete.question"
        [translateValues]="{ id: evaluationPrevue.id }"
      >
        Êtes-vous certain de vouloir supprimer le Evaluation Prevue {{ evaluationPrevue.id }} ?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
        <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
      </button>

      <button id="jhi-confirm-delete-evaluationPrevue" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times"></fa-icon>&nbsp;<span jhiTranslate="entity.action.delete">Supprimer</span>
      </button>
    </div>
  </form>
}
