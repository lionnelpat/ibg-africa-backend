@if (typeTache) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(typeTache.id!)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="typeTacheDeleteDialogHeading" jhiTranslate="entity.delete.title">Confirmation de suppression</h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      <p
        id="jhi-delete-typeTache-heading"
        jhiTranslate="forbidecBackendApp.typeTache.delete.question"
        [translateValues]="{ id: typeTache.id }"
      >
        Êtes-vous certain de vouloir supprimer le Type Tache {{ typeTache.id }} ?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
        <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
      </button>

      <button id="jhi-confirm-delete-typeTache" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times"></fa-icon>&nbsp;<span jhiTranslate="entity.action.delete">Supprimer</span>
      </button>
    </div>
  </form>
}
